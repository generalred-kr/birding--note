<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>탐조 기록장</title>
<style>
:root{--bg:#EEF1EA;--sf:#FFFFFF;--ink:#16231C;--mu:#58675E;--ln:#CFD7CC;--ac:#0E6B5C;--onac:#FFFFFF;--ac2:#DCEBE4;--wn:#963711;--wnbg:#FBEAE0;--hd:#EEF1EA;--sc:rgba(10,20,15,.45);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1713;--sf:#18231D;--ink:#E7EEE8;--mu:#9CAEA3;--ln:#2D3D34;--ac:#5CC8B0;--onac:#06231C;--ac2:#1E3A31;--wn:#F2A27C;--wnbg:#3A2218;--hd:#0F1713;--sc:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1713;--sf:#18231D;--ink:#E7EEE8;--mu:#9CAEA3;--ln:#2D3D34;--ac:#5CC8B0;--onac:#06231C;--ac2:#1E3A31;--wn:#F2A27C;--wnbg:#3A2218;--hd:#0F1713;--sc:rgba(0,0,0,.6);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);border-bottom:1px solid var(--ln);padding:10px 16px}
header .t{font-size:20px;font-weight:700;line-height:1.3}
header .c{font-size:14px;color:var(--mu);margin-top:2px}
main{max-width:640px;margin:0 auto;padding:12px 16px 120px}
h2{font-size:16px;font-weight:700;margin:22px 0 8px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px;margin:0 0 12px}
.row{display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.lab{font-size:14px;font-weight:700;margin:14px 0 6px;color:var(--mu)}
.lab:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:8px 14px;border:1px solid var(--ln);background:var(--sf);border-radius:10px;cursor:pointer;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--onac);font-weight:700}
.chip.sm{min-height:44px;padding:6px 12px}
.btn{min-height:52px;padding:10px 18px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);font-weight:700;cursor:pointer;width:100%;margin-top:10px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.btn.dng{color:var(--wn);border-color:var(--wn)}
.btn.half{width:auto;flex:1}
.btns{display:flex;gap:10px}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;min-height:48px;padding:8px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf)}
textarea{min-height:110px;font-size:14px}
.inl{display:flex;gap:8px;align-items:center}
.inl>*{flex:1;min-width:0}
.sp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sp{display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left;min-height:62px;padding:8px 12px;border:1px solid var(--ln);background:var(--sf);border-radius:10px;cursor:pointer;position:relative}
.sp .n{font-weight:700;font-size:17px}
.sp .s{font-size:12px;color:var(--mu);min-height:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.sp .b{position:absolute;top:8px;right:10px;background:var(--ac);color:var(--onac);border-radius:999px;font-size:13px;font-weight:700;padding:0 8px;line-height:22px}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;min-height:54px;padding:8px 14px;border:1px solid var(--ln);background:var(--sf);border-radius:10px;margin-bottom:8px;cursor:pointer}
.li .a{font-weight:700}
.li .z{font-size:14px;color:var(--mu);text-align:right}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--ac2);color:var(--ink);margin-left:6px}
.tag.w{background:var(--wnbg);color:var(--wn)}
.warn{background:var(--wnbg);color:var(--wn);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
.warn ul{margin:6px 0 0;padding-left:18px}
.ok{background:var(--ac2);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0}
pre{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px;font-size:12px;overflow-x:auto;max-height:200px;margin:8px 0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--hd);border-top:1px solid var(--ln);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;min-height:52px;border:0;background:none;font-weight:500;font-size:14px;color:var(--mu);border-radius:10px;cursor:pointer;position:relative}
nav button[aria-current="page"]{color:var(--ink);font-weight:700;background:var(--ac2)}
.scrim{position:fixed;inset:0;background:var(--sc);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0;font-size:20px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:700;text-align:center;max-width:608px;margin:0 auto}
.sw{display:inline-block;width:40px;height:40px;border-radius:50%;border:2px solid var(--ln);vertical-align:middle}
.sw.sm{width:16px;height:16px;border-width:1px;margin-right:4px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.pbtn{display:flex;flex-direction:column;align-items:center;gap:4px;min-height:84px;padding:8px 2px;border:2px solid var(--ln);background:var(--sf);border-radius:12px;font-size:13px;cursor:pointer}
.pbtn[aria-pressed="true"]{border-color:var(--ac);background:var(--ac2);font-weight:700}
.pbtn[aria-pressed="true"] .sw{border-color:var(--ac)}
.split{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:start}
.pt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:52px;padding:6px 10px;margin-bottom:6px;border:2px solid var(--ln);background:var(--sf);border-radius:10px;cursor:pointer;text-align:left}
.pt[aria-pressed="true"]{border-color:var(--ac);background:var(--ac2);font-weight:700}
.pt .dots{display:block;min-height:16px;line-height:1}
.pgrid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.pbtn.sm{min-height:66px;font-size:12px;padding:6px 2px}
.pbtn.sm .sw{width:30px;height:30px}
html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
header{position:static;flex:0 0 auto}
main{flex:1 1 auto;min-height:0;overflow-y:auto;width:100%;max-width:640px;margin:0 auto;padding:12px 16px 16px;-webkit-overflow-scrolling:touch}
nav{position:static;flex:0 0 auto}
.srch{position:sticky;top:-12px;z-index:2;background:var(--bg);padding:12px 0 6px;margin-top:-12px}
.sheet{height:88vh;max-height:88vh}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

 else if(a==='lesave'){var arr2=(ui.leText==null?S.lists[ui.le].join('\n'):ui.leText).split('\n').map(function(x){return x.trim()}).filter(Boolean);if(!arr2.length){toast('선택지가 하나는 있어야 합니다');return}S.lists[ui.le]=arr2;ui.leText=null;save();toast('저장했습니다')}
 else if(a==='lereset'){S.lists[ui.le]=DEF[ui.le].slice();ui.leText=null;save()}
 render()});

document.addEventListener('input',function(ev){
 var el=ev.target;if(!el.getAttribute)return;var a=el.getAttribute('data-act');
 if(a==='q'){ui.q=el.value;var r=document.getElementById('res');if(r)r.innerHTML=resHtml();return}
 if(a==='cnt'){var n=parseInt(el.value,10);if(ui.sheet){ui.sheet.d.count=n>0?n:null;var cs=sheetEl.querySelectorAll('[data-f="count"]');cs.forEach(function(c){c.setAttribute('aria-pressed','false')})}return}
 if(a==='inp'){var s=el.getAttribute('data-s'),f=el.getAttribute('data-f');
  if(s==='ui'){ui[f]=el.value;ui.rc=false;return}
  var o=target(s);if(!o)return;var val=el.value;if(f==='observers'){var nn=parseInt(val,10);val=nn>0?nn:''}else if(f==='km'){var kk=parseFloat(String(val).replace(',','.'));val=kk>0?kk:null}else if(f==='temp'){var tv=parseFloat(String(val).replace(',','.'));val=isNaN(tv)?'':tv}o[f]=val;afterSet(s);
  if(s==='feat'&&f==='confuse'){var cf=document.getElementById('cfl');if(cf)cf.innerHTML=cfLink(el.value)}}});
document.addEventListener('change',function(ev){
 var el=ev.target,a=el.getAttribute&&el.getAttribute('data-act');
 if(a==='ex'){ui.ex[el.getAttribute('data-id')]=el.checked;ui.csv=null;render()}
 else if(a==='ldfile'){
  var lf=el.files&&el.files[0];if(!lf)return;
  var fr=new FileReader();
  fr.onload=function(){try{var d=JSON.parse(fr.result);if(!d||!Array.isArray(d.trips))throw 0;ui.ld={src:lf.name,data:d}}catch(x){toast('백업 파일이 올바르지 않습니다')}render()};
  fr.onerror=function(){toast('파일을 읽지 못했습니다')};
  fr.readAsText(lf)}
 else if(a==='photo'){
  var file=el.files&&el.files[0];if(!file||!ui.sheet)return;
  var ty=file.type||'',ext=/jpe?g/.test(ty)?'jpg':/png/.test(ty)?'png':/webp/.test(ty)?'webp':'',ko=ui.sheet.ko,done=function(f,msg){mediaAdd('photo',f);try{el.value=''}catch(x){}render();toast(msg)};
  if(!ext){done('','이 사진 형식은 저장할 수 없어 시각만 기록했습니다. 휴대폰 사진 앱에서 확인하세요');return}
  var name=fileStamp()+'_'+ko+'.'+ext;
  saveFile(name,file).then(function(){done(name,'사진을 저장했습니다')}).catch(function(er){done('',er&&er.code==='declined'?'저장하지 않아 시각만 기록했습니다':'저장할 수 없어 시각만 기록했습니다')})}});
render();

 try{
  var d=raw?JSON.parse(raw):null;
  if(d&&Array.isArray(d.trips)){
   var localEmpty=!S.trips.length&&!S.obs.length,hasData=d.trips.length||(d.obs&&d.obs.length);
   if((localEmpty&&hasData)||(d.mt||0)>(S.mt||0)){S=mergeBase(d);ui.q='';ui.editNew=false;ui.draft=null;render();toast('저장된 기록을 불러왔습니다')}}
 }catch(x){}
 idbOK=true;persist()});
